name: Preserve TblackTV playlist compatibility

on:
  push:
    branches:
      - master
    paths:
      - playlist.m3u
      - scripts/ensure-tblacktv-compat.py

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out latest master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Rebase onto latest master
        run: git pull --rebase origin master

      - name: Preserve TblackTV v0.4.3-compatible stream URLs
        run: python3 scripts/ensure-tblacktv-compat.py

      - name: Commit normalization when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- playlist.m3u; then
            echo "Playlist already compatible."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u
          git commit -m "fix: preserve TblackTV v0.4.3 playlist compatibility"
          git push origin HEAD:master
